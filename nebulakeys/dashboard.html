<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Mi cuenta — NebulaKeys</title>

  <!-- Tailwind (CDN) -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Estilos mínimos -->
  <style>
    body { background:#0b0f1a; color:#e5e7eb; }
    .card { background:#0f1626; border:1px solid rgba(255,255,255,.06); }
    .btn { display:inline-block; padding:.6rem 1rem; border-radius:.6rem; border:1px solid rgba(255,255,255,.12); }
    .btn:hover { background:rgba(255,255,255,.06); }
    .btn-primary { background:#5b61ff; border-color:#5b61ff; color:white; }
    .btn-primary:hover { filter:brightness(1.05); }
  </style>

  <!-- Tu configuración pública (antes del módulo) -->
  <script defer src="/scripts/config.js"></script>
</head>
<body class="min-h-screen">
  <header class="max-w-4xl mx-auto px-4 py-8">
    <h1 class="text-4xl font-extrabold">Mi cuenta</h1>
  </header>

  <main class="max-w-4xl mx-auto px-4 pb-24 space-y-10">

    <!-- Estado de suscripción -->
    <section class="card rounded-2xl p-6">
      <h2 class="text-2xl font-bold mb-3">Estado de suscripción</h2>
      <p id="subStatus" class="text-slate-300">Comprobando…</p>

      <div id="subInfo" class="mt-4 hidden space-y-1">
        <p><span class="text-slate-400">Plan:</span> <span id="plan"></span></p>
        <p><span class="text-slate-400">Vence:</span> <span id="until">—</span></p>
      </div>

      <div class="mt-6 flex gap-3">
        <a href="/index.html" class="btn">← Volver al lobby</a>
        <a id="subscribeBtn" class="btn btn-primary cursor-pointer">Suscribirme</a>
      </div>
    </section>

    <!-- Aquí puedes mantener tu sección de juegos / biblioteca -->
  </main>

  <!-- ========== MODAL DE PLANES ========== -->
  <div id="plansModal" class="fixed inset-0 z-50 hidden">
    <!-- overlay -->
    <div class="absolute inset-0 bg-black/60"></div>

    <!-- tarjeta -->
    <div class="relative mx-auto max-w-xl mt-24 card rounded-2xl p-6">
      <div class="flex items-center justify-between mb-4">
        <h3 class="text-xl font-bold">Elige tu plan</h3>
        <button id="closePlans" class="btn">✕</button>
      </div>

      <div class="grid gap-3">
        <button class="btn btn-primary flex items-center justify-between" data-plan="weekly">
          <span>Plan semanal</span>
          <span class="opacity-80">$150 MXN</span>
        </button>

        <button class="btn btn-primary flex items-center justify-between" data-plan="biweekly">
          <span>Plan quincenal</span>
          <span class="opacity-80">$250 MXN</span>
        </button>

        <button class="btn btn-primary flex items-center justify-between" data-plan="monthly">
          <span>Plan mensual</span>
          <span class="opacity-80">$350 MXN</span>
        </button>
      </div>
    </div>
  </div>
  <!-- ===================================== -->

  <!-- Lógica del dashboard -->
  <script type="module" src="/scripts/dashboard.js"></script>
</body>
</html>
