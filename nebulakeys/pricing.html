<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Elige tu plan — NebulaKeys</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script defer src="/scripts/config.js"></script>
  <style>
    body { background:#0b0f1a; color:#e5e7eb; }
    .card { background:#0f1626; border:1px solid rgba(255,255,255,.06); }
    .btn { display:inline-block; padding:.6rem 1rem; border-radius:.6rem; border:1px solid rgba(255,255,255,.12); }
    .btn-primary { background:#5b61ff; border-color:#5b61ff; color:white; }
    .btn-primary:hover { filter:brightness(1.05); }
  </style>
</head>
<body class="min-h-screen">
  <main class="max-w-5xl mx-auto px-4 py-12">
    <h1 class="text-3xl font-extrabold mb-8">Elige tu plan</h1>

    <div class="grid md:grid-cols-3 gap-6">
      <div class="card p-6 rounded-2xl">
        <h2 class="text-xl font-bold mb-2">Starter (semanal)</h2>
        <p class="text-slate-300 mb-6">$150 MXN / semana</p>
        <button class="btn btn-primary" data-price="price_1SJH1zKwqs0TzO3l23W3RIfE">Suscribirme</button>
      </div>

      <div class="card p-6 rounded-2xl">
        <h2 class="text-xl font-bold mb-2">Pro (mensual)</h2>
        <p class="text-slate-300 mb-6">$??? MXN / mes</p>
        <button class="btn btn-primary" data-price="price_1SJH4eKwqs0TzO3l1ODa7pRx">Suscribirme</button>
      </div>

      <div class="card p-6 rounded-2xl">
        <h2 class="text-xl font-bold mb-2">Ultimate</h2>
        <p class="text-slate-300 mb-6">$??? MXN</p>
        <button class="btn btn-primary" data-price="price_1SJH9FKwqs0TzO3lxTTonf6H">Suscribirme</button>
      </div>
    </div>

    <a href="/dashboard.html" class="inline-block mt-10 btn">← Volver al dashboard</a>
  </main>

  <script type="module">
    document.querySelectorAll('[data-price]').forEach(btn => {
      btn.addEventListener('click', async () => {
        btn.disabled = true;
        btn.textContent = 'Redirigiendo…';
        try {
          const price = btn.getAttribute('data-price');
          const res = await fetch(`/api/create-checkout?price=${encodeURIComponent(price)}`);
          if (!res.ok) throw new Error(await res.text());
          const { url } = await res.json();
          location.href = url;
        } catch (e) {
          alert(e.message);
          btn.disabled = false;
          btn.textContent = 'Suscribirme';
        }
      });
    });
  </script>
</body>
</html>
