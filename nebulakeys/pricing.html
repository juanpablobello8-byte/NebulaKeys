<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Planes — NebulaKeys</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Tu config pública con SUPABASE_URL y SUPABASE_ANON_KEY -->
  <script defer src="/scripts/config.js"></script>

  <style>
    body { background:#0b0f1a; color:#e5e7eb; }
    .card { background:#0f1626; border:1px solid rgba(255,255,255,.06); }
    .btn  { display:inline-block; padding:.8rem 1.2rem; border-radius:.6rem; border:1px solid rgba(255,255,255,.12); }
    .btn-primary { background:#5b61ff; border-color:#5b61ff; color:#fff; }
    .btn-primary:hover { filter:brightness(1.05); }
  </style>
</head>
<body class="min-h-screen">
  <header class="max-w-4xl mx-auto px-4 py-8">
    <h1 class="text-4xl font-extrabold">Elige tu plan</h1>
  </header>

  <main class="max-w-4xl mx-auto px-4 pb-24 space-y-8">

    <!-- PLAN SEMANAL -->
    <section class="card rounded-2xl p-6">
      <h2 class="text-2xl font-bold mb-2">Plan Semanal</h2>
      <p class="text-slate-300 mb-4">MXN $150 / semana</p>
      <button
        type="button"
        class="btn btn-primary subscribe"
        data-price="price_1SJH1zKwqs0TzO3l23W3RifE">
        Suscribirme
      </button>
    </section>

    <!-- PLAN QUINCENAL -->
    <section class="card rounded-2xl p-6">
      <h2 class="text-2xl font-bold mb-2">Plan Quincenal</h2>
      <p class="text-slate-300 mb-4">MXN $250 / quincenal</p>
      <button
        type="button"
        class="btn btn-primary subscribe"
        data-price="price_1SJH4eKwqs0TzO3l1ODa7pRx ">
        Suscribirme
      </button>
    </section>

    <!-- PLAN MENSUAL -->
    <section class="card rounded-2xl p-6">
      <h2 class="text-2xl font-bold mb-2">Plan Mensual</h2>
      <p class="text-slate-300 mb-4">MXN $350 / mensual</p>
      <button
        type="button"
        class="btn btn-primary subscribe"
        data-price="price_1SJH9FKwqs0TzO3lxTTonf6H">
        Suscribirme
      </button>
    </section>

  </main>

  <!-- LÓGICA: POST a /api/create-checkout-session -->
  <script type="module">
    import { createClient } from 'https://esm.sh/@supabase/supabase-js@2';

    // 1) Supabase (toma tu config pública)
    const { SUPABASE_URL, SUPABASE_ANON_KEY } = window.NEBULA_PUBLIC || {};
    const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    // 2) Listeners de los botones
    document.querySelectorAll('.subscribe').forEach(btn => {
      btn.addEventListener('click', async () => {
        const { data: { user } } = await supabase.auth.getUser();
        if (!user) {
          // si no hay sesión, pide login
          window.location.href = '/login.html?next=/pricing.html';
          return;
        }

        const priceId = btn.dataset.price;

        try {
          const resp = await fetch('/api/create-checkout-session', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              priceId,
              userId: user.id,
              email: user.email
            })
          });

          const data = await resp.json();
          if (!resp.ok) {
            alert('Error iniciando checkout: ' + (data.error || resp.statusText));
            return;
          }

          // Redirige a Stripe Checkout
          window.location.href = data.url;
        } catch (err) {
          alert('Error iniciando checkout: ' + err.message);
        }
      });
    });
  </script>
</body>
</html>
