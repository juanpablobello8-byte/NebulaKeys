<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>NebulaKeys — Ingresar</title>
  <link rel="preconnect" href="https://cdn.jsdelivr.net" />
  <style>
    :root { color-scheme: dark; }
    body{margin:0;background:#0b1020;color:#e9ecf2;font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial;}
    .wrap{max-width:1100px;margin:32px auto;padding:0 16px;display:grid;grid-template-columns:1fr 420px;gap:32px}
    h1{font-size:44px;line-height:1.1;margin:.4rem 0 1rem}
    .card{background:#0f162e;border:1px solid #233055;border-radius:14px;padding:22px 22px 26px;box-shadow:0 6px 20px rgba(0,0,0,.25)}
    .label{display:block;font-size:14px;margin:14px 0 6px;color:#a9b4ce}
    .input{width:100%;padding:14px 16px;border:1px solid #26355c;border-radius:12px;background:#0b1329;color:#e9ecf2;font-size:15px;outline:none}
    .input:focus{border-color:#5b7cff;box-shadow:0 0 0 3px rgba(91,124,255,.25)}
    .row{display:flex;align-items:center;gap:10px;margin-top:12px}
    .btn{width:100%;padding:16px;border:0;border-radius:12px;background:#575bff;color:white;font-weight:700;font-size:16px;cursor:pointer;margin-top:18px}
    .btn[disabled]{opacity:.6;cursor:not-allowed}
    small{color:#c7d1ea}
    .muted{color:#95a1bd;font-size:14px}
    .brand{display:flex;align-items:center;gap:12px}
    .logo{width:38px;height:38px;border-radius:50%;background:#4b55ff;display:grid;place-items:center;color:white;font-weight:800}
    @media (max-width: 980px){ .wrap{grid-template-columns:1fr} }
  </style>
</head>
<body>
  <div class="wrap">
    <section>
      <div class="brand"><div class="logo">NK</div><strong>NebulaKeys</strong></div>
      <p class="muted" style="margin:18px 0 2px">ACCESO</p>
      <h1>Crea tu cuenta o<br/>inicia sesión</h1>
      <p class="muted">Manejo seguro con Supabase. Tu usuario de Steam nos permite activar tu suscripción en tu cuenta de Steam.</p>
    </section>

    <section class="card">
      <form id="loginForm" autocomplete="off" novalidate>
        <h3 style="margin:4px 0 10px">NebulaKeys — Ingresar</h3>

        <label class="label" for="email">Email</label>
        <input id="email" class="input" type="email" placeholder="tuCorreo@example.com" required />

        <label class="label" for="password">Contraseña</label>
        <input id="password" class="input" type="password" minlength="6" placeholder="••••••" required />

        <label class="label" for="steamUser">Usuario de Steam</label>
        <input id="steamUser" class="input" type="text" placeholder="TuUsuarioDeSteam" />

        <div class="row">
          <input id="isLogin" type="checkbox" />
          <label for="isLogin" class="muted">Ya tengo cuenta (Iniciar sesión)</label>
        </div>

        <small class="muted">IMPORTANTE: Este usuario se usará para activar la suscripción en tu cuenta de Steam.</small>

        <button id="submitBtn" type="submit" class="btn">Continuar</button>
        <p class="muted" style="text-align:right;margin:10px 0 0">
          ¿Listo? <a href="/index.html" style="color:#aeb8ff">Volver al inicio</a>
        </p>
      </form>
    </section>
  </div>

  <!-- Supabase JS v2 -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <!-- Tu config con URL y ANON KEY (DEBE ir antes de auth.js) -->
  <script src="/scripts/config.js"></script>
  <!-- Lógica de autenticación -->
  <script defer src="/scripts/auth.js"></script>
</body>
</html>
