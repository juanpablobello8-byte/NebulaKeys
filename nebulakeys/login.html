<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>NebulaKeys — Ingresar</title>

  <!-- Tailwind para estilos rápidos -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Config pública de Supabase (debe existir /scripts/config.js) -->
  <script defer src="/scripts/config.js"></script>

  <style>
    body {
      background:#0b0f1a;
      color:#fff;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Inter", sans-serif;
      min-height:100vh;
      display:flex;
      align-items:flex-start;
      justify-content:center;
      padding-top:4rem;
    }

    .card {
      width:100%;
      max-width:440px;
      background:#0f1626;
      border:1px solid rgba(255,255,255,.08);
      border-radius:1rem;
      padding:2rem;
    }

    label {
      display:block;
      font-size:.8rem;
      font-weight:500;
      color:#cbd5e1;
      margin-bottom:.4rem;
    }

    input[type="email"],
    input[type="password"],
    input[type="text"] {
      width:100%;
      background:#1e2538;
      border:1px solid #475569;
      border-radius:.5rem;
      padding:.75rem 1rem;
      color:#fff;
      font-size:.9rem;
    }
    input:focus {
      outline:none;
      border-color:#6366f1;
    }

    .btn-main {
      background:#5b61ff;
      border:1px solid #5b61ff;
      color:#fff;
      border-radius:.5rem;
      padding:.75rem 1rem;
      font-weight:600;
      text-align:center;
      width:100%;
      font-size:.9rem;
      cursor:pointer;
    }
    .btn-main:disabled {
      opacity:.5;
      cursor:not-allowed;
    }

    .toggle-row {
      display:flex;
      align-items:center;
      gap:.5rem;
      font-size:.75rem;
      color:#94a3b8;
      margin-top:.5rem;
      user-select:none;
    }

    .foot-link {
      color:#6b7280;
      font-size:.75rem;
      text-align:center;
      margin-top:1.5rem;
    }
    .foot-link a {
      color:#9ca3af;
      text-decoration:underline;
    }

    .error-msg {
      font-size:.8rem;
      color:#f87171;
      line-height:1.4;
      margin-top:.75rem;
      display:none;
    }
    .error-msg.show {
      display:block;
    }
  </style>
</head>
<body>

  <main class="card">
    <h1 class="text-xl font-bold mb-1">NebulaKeys — Ingresar</h1>
    <p class="text-slate-400 text-sm mb-6">
      Crea tu cuenta o inicia sesión con email y contraseña.
    </p>

    <!-- FORM -->
    <form id="authForm" class="space-y-5">

      <!-- Email -->
      <div>
        <label for="email">Email</label>
        <input
          id="email"
          type="email"
          required
          placeholder="tucorreo@example.com"
        />
      </div>

      <!-- Password -->
      <div>
        <label for="password">Contraseña</label>
        <input
          id="password"
          type="password"
          required
          minlength="6"
          placeholder="********"
        />
      </div>

      <!-- Steam user -->
      <div>
        <label for="steam">Usuario de Steam</label>
        <input
          id="steam"
          type="text"
          placeholder="UsuarioDeSteam"
        />
        <p class="text-amber-300 text-xs mt-1 leading-snug">
          IMPORTANTE: Este usuario se usará para activar la suscripción
          en tu cuenta de Steam.
        </p>
      </div>

      <!-- Toggle login / signup -->
      <div class="toggle-row">
        <input
          id="modeToggle"
          type="checkbox"
          class="cursor-pointer accent-indigo-500"
        />
        <label
          for="modeToggle"
          class="cursor-pointer select-none"
        >
          Ya tengo cuenta (Iniciar sesión)
        </label>
      </div>

      <!-- Submit -->
      <button
        id="submitBtn"
        type="submit"
        class="btn-main"
      >
        Continuar
      </button>

      <!-- Mensaje de error -->
      <p
        id="authError"
        class="error-msg"
      ></p>

    </form>

    <p class="foot-link">
      ¿Listo? <a href="/index.html">Volver al inicio</a>
    </p>
  </main>

  <!-- Lógica del login/registro -->
  <script type="module" src="/scripts/auth.js"></script>
</body>
</html>
