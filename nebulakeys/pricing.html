<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Elige tu plan — NebulaKeys</title>

  <!-- Tailwind (CDN) -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- (Opcional) Tu config pública si usas Supabase para leer el email del usuario -->
  <!-- Si no usas Supabase, puedes borrar esta línea y el bloque "SUPABASE (opcional)" del script -->
  <script defer src="/scripts/config.js"></script>

  <style>
    body { background:#0b0f1a; color:#e5e7eb; }
    .card { background:#0f1626; border:1px solid rgba(255,255,255,.06); }
    .btn  { display:inline-block; padding:.8rem 1.2rem; border-radius:.7rem; border:1px solid rgba(255,255,255,.12); }
    .btn:hover { background:rgba(255,255,255,.06); }
    .btn-primary { background:#5b61ff; border-color:#5b61ff; color:white; }
    .btn-primary[disabled] { opacity:.6; cursor:not-allowed; }
  </style>
</head>

<body class="min-h-screen">
  <header class="max-w-4xl mx-auto px-4 py-10">
    <h1 class="text-4xl font-extrabold">Elige tu plan</h1>
    <p class="text-slate-400 mt-2">Suscripción segura con Stripe. Puedes cancelar cuando quieras.</p>
  </header>

  <main class="max-w-4xl mx-auto px-4 pb-24 space-y-8">

    <!-- Plan semanal -->
    <section class="card rounded-2xl p-6">
      <div class="flex items-center justify-between gap-6 flex-col md:flex-row">
        <div>
          <h2 class="text-2xl font-bold">Plan Semanal</h2>
          <p class="text-slate-400 mt-1">MXN $150 / semana</p>
        </div>
        <button
          class="subscribe btn btn-primary"
          data-price="REPLACE_PRICE_WEEKLY"  <!-- TODO: reemplaza con tu Price ID -->
        >
          Suscribirme
        </button>
      </div>
    </section>

    <!-- Plan quincenal -->
    <section class="card rounded-2xl p-6">
      <div class="flex items-center justify-between gap-6 flex-col md:flex-row">
        <div>
          <h2 class="text-2xl font-bold">Plan Quincenal</h2>
          <p class="text-slate-400 mt-1">MXN $250 / quincenal</p>
        </div>
        <button
          class="subscribe btn btn-primary"
          data-price="REPLACE_PRICE_BIWEEKLY"  <!-- TODO: reemplaza con tu Price ID -->
        >
          Suscribirme
        </button>
      </div>
    </section>

    <!-- Plan mensual -->
    <section class="card rounded-2xl p-6">
      <div class="flex items-center justify-between gap-6 flex-col md:flex-row">
        <div>
          <h2 class="text-2xl font-bold">Plan Mensual</h2>
          <p class="text-slate-400 mt-1">MXN $350 / mensual</p>
        </div>
        <button
          class="subscribe btn btn-primary"
          data-price="REPLACE_PRICE_MONTHLY"  <!-- TODO: reemplaza con tu Price ID -->
        >
          Suscribirme
        </button>
      </div>
    </section>

    <div class="text-center">
      <a href="/index.html" class="btn">← Volver al lobby</a>
    </div>
  </main>

  <!-- Lógica de checkout -->
  <script type="module">
    // ===== SUPABASE (opcional) =====
    // Obtiene email/userId si tienes config pública en /scripts/config.js
    let supabase = null;
    let currentUserEmail = null;
    let currentUserId = null;

    try {
      if (window.NEBULA_PUBLIC?.SUPABASE_URL && window.NEBULA_PUBLIC?.SUPABASE_ANON_KEY) {
        const { createClient } = await import('https://esm.sh/@supabase/supabase-js@2');
        supabase = createClient(
          window.NEBULA_PUBLIC.SUPABASE_URL,
          window.NEBULA_PUBLIC.SUPABASE_ANON_KEY
        );
        const { data } = await supabase.auth.getUser();
        if (data?.user) {
          currentUserEmail = data.user.email || null;
          currentUserId   = data.user.id || null;
        }
      }
    } catch (e) {
      console.warn('Supabase no está configurado o falló la carga (opcional).', e);
    }
    // ===== FIN SUPABASE =====

    // Suscribir botones
    const buttons = document.querySelectorAll('.subscribe[data-price]');

    buttons.forEach(btn => {
      btn.addEventListener('click', async () => {
        const priceId = btn.dataset.price?.trim();
        if (!priceId) return alert('No se encontró el Price ID en el botón.');

        // Deshabilita el botón mientras se crea la sesión
        const originalText = btn.textContent;
        btn.textContent = 'Redirigiendo…';
        btn.disabled = true;

        try {
          const r = await fetch('/api/create-checkout-session', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              priceId,
              email: currentUserEmail || undefined,
              userId: currentUserId || undefined
            })
          });

          const data = await r.json();
          if (!r.ok) throw new Error(data?.error || 'No fue posible iniciar el checkout');

          // Redirige a Stripe
          location.href = data.url;
        } catch (err) {
          alert('Error iniciando checkout: ' + err.message);
          btn.textContent = originalText;
          btn.disabled = false;
        }
      });
    });
  </script>
</body>
</html>
