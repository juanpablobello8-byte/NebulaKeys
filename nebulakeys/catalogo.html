<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Catálogo — NebulaKeys</title>

  <!-- Tailwind por CDN, mismo estilo que el resto del sitio -->
  <script src="https://cdn.tailwindcss.com"></script>

  <style>
    body { background:#0b0f1a; color:#e5e7eb; }
    .card { background:#0f1626; border:1px solid rgba(255,255,255,.06); }
    .btn { display:inline-block; padding:.6rem 1rem; border-radius:.6rem; border:1px solid rgba(255,255,255,.12); }
    .btn:hover { background:rgba(255,255,255,.06); }
    /* 2 líneas de descripción */
    .clamp-2 {
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .badge {
      display:inline-block;
      padding: .25rem .5rem;
      background: rgba(91,97,255,.12);
      border: 1px solid rgba(91,97,255,.35);
      border-radius: .5rem;
      font-size: .75rem;
      color: #cdd1ff;
    }
  </style>
</head>

<body class="min-h-screen">
  <header class="max-w-6xl mx-auto px-4 py-8">
    <h1 class="text-4xl font-extrabold">Catálogo</h1>
    <p class="text-slate-400 mt-1">Explora juegos disponibles en la biblioteca.</p>
  </header>

  <main class="max-w-6xl mx-auto px-4 pb-24 space-y-6">
    <!-- Buscador -->
    <div class="flex items-center gap-3">
      <input id="q" type="search" placeholder="Buscar..."
             class="w-full md:w-96 bg-[#0f1626] border border-white/10 rounded-xl px-4 py-3 outline-none focus:border-indigo-400"
             autocomplete="off" />
      <span id="count" class="text-slate-400 text-sm"></span>
    </div>

    <!-- Grid -->
    <section id="grid"
      class="grid grid-cols-2 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 xl:grid-cols-5 gap-4">
      <!-- Cards generadas por JS -->
    </section>

    <!-- Sin resultados -->
    <p id="empty" class="hidden text-slate-400">No se encontraron juegos para tu búsqueda.</p>
  </main>

  <script type="module" src="/scripts/catalogo.js"></script>
</body>
</html>
