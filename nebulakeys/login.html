<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>NebulaKeys — Ingresar</title>
<script src="https://cdn.tailwindcss.com"></script>
<script defer src="/scripts/config.js"></script>
<style>
  body { background:#0b0f1a; color:#fff; }
  .card { background:#0f1626; border:1px solid rgba(255,255,255,.08); max-width:400px; margin:4rem auto; padding:2rem; border-radius:1rem; }
  label { display:block; font-size:.9rem; color:#cbd5e1; margin-bottom:.25rem; }
  input { width:100%; background:#1e2538; border:1px solid #475569; border-radius:.5rem; padding:.75rem 1rem; color:#fff; }
  .btn { background:#5b61ff; color:#fff; border-radius:.5rem; padding:.75rem 1rem; text-align:center; width:100%; font-weight:600; }
</style>
</head>
<body>
  <div class="card">
    <h1 class="text-xl font-bold mb-1">NebulaKeys — Ingresar</h1>
    <p class="text-slate-400 text-sm mb-6">
      Crea tu cuenta o inicia sesión con email y contraseña.
    </p>

    <label class="mb-2">
      Email
      <input id="email" type="email" required placeholder="tucorreo@example.com" />
    </label>

    <label class="mb-2 mt-4">
      Contraseña
      <input id="password" type="password" required placeholder="********" />
    </label>

    <label class="mb-2 mt-4">
      Usuario de Steam
      <input id="steam" type="text" placeholder="tuUsuarioDeSteam" />
      <small class="text-slate-500 block mt-1 text-xs">
        IMPORTANTE: Este usuario se usará para activar la suscripción en tu cuenta de Steam.
      </small>
    </label>

    <div class="text-slate-400 text-xs flex items-center gap-2 my-4">
      <input id="modeToggle" type="checkbox" class="cursor-pointer" />
      <label for="modeToggle" class="cursor-pointer select-none">Ya tengo cuenta (Iniciar sesión)</label>
    </div>

    <button id="submitBtn" class="btn w-full">Continuar</button>

    <p id="authError" class="text-red-400 text-sm mt-4 hidden"></p>

    <p class="text-center text-slate-500 text-xs mt-6">
      ¿Listo? <a href="/index.html" class="underline">Volver al inicio</a>
    </p>
  </div>

  <script type="module" src="/scripts/auth.js"></script>
  <script>
    // reenvía el click del botón al form submit
    const btn = document.getElementById('submitBtn');
    const formProxy = document.createElement('form');
    formProxy.id = 'authForm';
    document.body.appendChild(formProxy);

    btn.addEventListener('click', () => formProxy.requestSubmit());

    // hack: montamos inputs en el "form virtual"
    formProxy.append(
      document.getElementById('email'),
      document.getElementById('password'),
      document.getElementById('steam'),
      document.getElementById('modeToggle')
    );
  </script>
</body>
</html>
