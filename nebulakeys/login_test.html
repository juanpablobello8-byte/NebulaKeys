<!doctype html>
<html lang="es">
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Login Test — NebulaKeys</title>
<style>
  :root { color-scheme: dark; }
  body{margin:0;background:#0b1020;color:#e9ecf2;font-family:system-ui,Segoe UI,Roboto,Helvetica,Arial}
  .wrap{max-width:480px;margin:40px auto;padding:0 16px}
  .card{background:#0f162e;border:1px solid #233055;border-radius:14px;padding:22px;box-shadow:0 6px 20px rgba(0,0,0,.25)}
  label{display:block;margin:12px 0 6px;color:#a9b4ce}
  input{width:100%;padding:12px 14px;border:1px solid #26355c;border-radius:12px;background:#0b1329;color:#e9ecf2}
  input:focus{outline:none;border-color:#5b7cff;box-shadow:0 0 0 3px rgba(91,124,255,.25)}
  button{width:100%;padding:14px;border:0;border-radius:12px;background:#575bff;color:#fff;font-weight:700;margin-top:14px;cursor:pointer}
  pre{white-space:pre-wrap;background:#0b1329;border:1px solid #26355c;border-radius:12px;padding:12px;margin-top:14px}
  small{color:#9ab1ff}
</style>
<div class="wrap">
  <h2>Login Test — NebulaKeys</h2>
  <div class="card">
    <label>Email</label>
    <input id="email" type="email" placeholder="tu@correo.com" />
    <label>Contraseña</label>
    <input id="pass" type="password" placeholder="mín 6" />
    <label>Steam user (opcional)</label>
    <input id="steam" type="text" placeholder="TuUsuarioSteam" />
    <label><input id="isLogin" type="checkbox" /> Ya tengo cuenta</label>
    <button id="go">Continuar</button>
    <small>Verás el resultado abajo. Si no aparece ninguna petición a /auth, es un tema de script/DOM.</small>
    <pre id="out">Listo.</pre>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
  // 1) PON AQUÍ TUS CREDENCIALES
  const SUPABASE_URL = "https://uhsggttdnajnhpmlzyud.supabase.co";
  const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InVoc2dndHRkbmFqbmhwbWx6eXVkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjA2Nzg2MDksImV4cCI6MjA3NjI1NDYwOX0.KMP5Wts7DgJxEPh8W_SayvsqsOJ7NTMI9lqvMiMKPAg";

  // 2) CLIENTE
  const client = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
  const $ = (id) => document.getElementById(id);
  const log = (x) => { console.log(x); $('out').textContent = typeof x === 'string' ? x : JSON.stringify(x, null, 2); };

  $('go').addEventListener('click', async () => {
    const email = $('email').value.trim();
    const password = $('pass').value.trim();
    const steam = $('steam').value.trim();
    const isLogin = $('isLogin').checked;

    if (!email || !password) return log('Falta email/contraseña');

    try {
      log('Preparando...');
      if (isLogin) {
        // LOGIN
        const { data, error } = await client.auth.signInWithPassword({ email, password });
        if (error) throw error;

        // Actualiza profiles.steam_user (si vino)
        if (steam) await client.from('profiles').update({ steam_user: steam }).eq('id', data.user.id);

        log(['LOGIN OK', data]);
      } else {
        // SIGNUP
        const { data, error } = await client.auth.signUp({
          email,
          password,
          options: { data: { steam_user: steam || null } }
        });
        if (error) {
          // ya existe → intenta login
          if (/already registered/i.test(error.message)) {
            const r2 = await client.auth.signInWithPassword({ email, password });
            if (r2.error) throw r2.error;
            if (steam) await client.from('profiles').update({ steam_user: steam }).eq('id', r2.data.user.id);
            log(['USUARIO EXISTENTE → LOGIN OK', r2.data]);
          } else {
            throw error;
          }
        } else {
          if (data.user) {
            // crea/actualiza perfil
            await client.from('profiles')
              .upsert({ id: data.user.id, email, steam_user: steam || null }, { onConflict: 'id' });
            log(['SIGNUP OK (sin confirmación)', data]);
          } else {
            log('SIGNUP enviado (con confirmación de correo). Revisa tu bandeja.');
          }
        }
      }
    } catch (e) {
      log(['ERROR', e.message || e]);
    }
  });
</script>
</html>
