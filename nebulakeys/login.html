<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Ingresar — NebulaKeys</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <!-- tu config pública -->
  <script defer src="/scripts/config.js?v=4"></script>
  <!-- lógica de login: DEBE ir después de config.js -->
  <script defer src="/scripts/auth.js?v=2"></script>
</head>
<body class="bg-gray-950 text-gray-100">
  <main class="max-w-md mx-auto px-4 py-16">
    <h1 class="text-3xl font-extrabold">NebulaKeys — Ingresar</h1>
    <p class="mt-2 text-gray-300 text-sm">Crea tu cuenta o inicia sesión con email y contraseña.</p>

    <!-- CREAR CUENTA -->
    <form id="signup-form" class="mt-8 space-y-4">
      <input id="signup-email" class="w-full px-4 py-3 rounded-xl bg-black/40 border border-white/10" type="email" placeholder="Correo" required />
      <input id="signup-password" class="w-full px-4 py-3 rounded-xl bg-black/40 border border-white/10" type="password" placeholder="Contraseña (min. 6)" required minlength="6" />
      <label class="block text-slate-300 mb-2" for="steam">
  Usuario de Steam
</label>
<input id="steam" class="w-full input" placeholder="tu_usuario_de_steam" />
<p class="text-amber-300 text-sm mt-1">
  Asegúrate de que el usuario de Steam sea correcto. Lo usaremos para activar tu suscripción en la cuenta indicada.
</p>
      <button type="submit" class="w-full bg-indigo-500 hover:bg-indigo-400 text-black font-semibold px-4 py-3 rounded-xl">Crear cuenta</button>
      <p id="signup-msg" class="text-sm text-gray-300"></p>
    </form>

    <hr class="my-6 border-white/10" />

    <!-- INICIAR SESIÓN -->
    <form id="signin-form" class="space-y-4">
      <input id="signin-email" class="w-full px-4 py-3 rounded-xl bg-black/40 border border-white/10" type="email" placeholder="Correo" required />
      <input id="signin-password" class="w-full px-4 py-3 rounded-xl bg-black/40 border border-white/10" type="password" placeholder="Contraseña" required />
      <button type="submit" class="w-full border border-white/15 hover:border-white/40 px-4 py-3 rounded-xl">Iniciar sesión</button>
      <p id="signin-msg" class="text-sm text-gray-300"></p>
    </form>

    <a href="/" class="mt-8 inline-block text-indigo-300 hover:text-indigo-200">← Volver</a>
  </main>
</body>
</html>
