<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Catálogo — NebulaKeys</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { background:#0b0f1a; color:#e5e7eb; }
    .card { background:#0f1626; border:1px solid rgba(255,255,255,.06); }
  </style>
</head>
<body class="min-h-screen">
  <header class="max-w-6xl mx-auto px-4 py-8">
    <h1 class="text-4xl font-extrabold">Catálogo</h1>
    <p class="text-slate-400 mt-1">Explora juegos disponibles en la biblioteca.</p>
  </header>

  <main class="max-w-6xl mx-auto px-4 pb-24 space-y-8">
    <!-- Buscador -->
    <div class="flex items-center gap-3">
      <input id="q" type="search" placeholder="Buscar..."
             class="w-full md:w-96 bg-[#0f1626] border border-white/10 rounded-xl px-4 py-2 outline-none" />
      <span id="count" class="text-slate-400 text-sm"></span>
    </div>

    <!-- Grid -->
    <section id="grid"
      class="grid grid-cols-2 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 xl:grid-cols-5 gap-5">
    </section>

    <!-- Sin resultados -->
    <p id="empty" class="hidden text-slate-400">No se encontraron juegos para tu búsqueda.</p>
  </main>

  <!-- Carga el JS -->
  <script type="module" src="/scripts/catalogo.js?v=2"></script>
</body>
</html>
