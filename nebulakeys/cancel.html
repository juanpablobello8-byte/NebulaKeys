<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Pago cancelado — NebulaKeys</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-950 text-gray-100">
  <main class="max-w-xl mx-auto px-6 py-16 text-center">
    <h1 class="text-4xl font-extrabold">❌ Pago cancelado</h1>
    <p class="mt-3 text-gray-300">
      No se realizó ningún cargo. Puedes volver a intentarlo cuando quieras.
    </p>

    <div class="mt-8 flex flex-wrap gap-3 justify-center">
      <a href="/#planes" class="px-5 py-3 rounded-xl bg-indigo-600 hover:bg-indigo-500 text-white font-semibold">Ver planes</a>
      <a href="/" class="px-5 py-3 rounded-xl border border-white/15 hover:border-white/40">Volver al inicio</a>
    </div>

    <p class="mt-8 text-xs text-gray-500">
      Si crees que esto fue un error, intenta nuevamente o contáctanos.
    </p>
  </main>
</body>
</html>
